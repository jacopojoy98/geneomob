# geomob configuration file (TOML).
# Use with:  python -m geomob.cli <command> --config this_file.toml
# Precedence: built-in defaults < [common] < [<command>] < command-line flags.
# Unknown sections / keys are an error, so typos are caught.
# Command options are listed commented-out at their defaults: uncomment
# and edit only what you change (the run record saves ALL of them anyway).
# A line '# key =' means the default is 'unset'.

[paths]
# dataset locations; these beat exported DATA_<NAME> variables
# porto = "/path/to/porto"
# tdrive = "/path/to/tdrive"
# geolife = "/path/to/geolife"
# roma = "/path/to/roma"
# ais = "/path/to/ais"
# csv = "/path/to/csv"

[common]
# applied to every command that has the option
# device = "cuda"
# seeds = [0, 1, 2]

[model]
# width of every sequence model (LSTM / Transformer / GNN)
hidden = 128
# LSTM and Transformer depth
layers = 2
# attention heads (Transformer, GAT)
heads = 4
# dropout inside the sequence model
dropout = 0.0

[encoders]
# embedding size: GPE h, and GEO's total dimension (half location, half displacement)
h = 128
# GPE Algorithm 1 epsilon-cut
gpe_eps_over_2pi = 1e-06
# how many of the h numbers go to LOCATION (multiple of 4); the rest goes to displacement: angular first (2 per harmonic), what remains to the radial part. 0 = half. Total stays exactly h. With h=128 and 2 harmonics: 64 = default, 96 = 96 loc + 28 radial + 4 angular, 124 = no radial part (angular only), 128 with geo_harmonics=[] = location only. When set, the two *_scales keys must stay 0
geo_loc_dims = 0
# number of torus-lattice scales; 0 = h // 8
geo_loc_scales = 0
# finest location wavelength (m)
geo_loc_lam_min_m = 25.0
# coarsest location wavelength (m)
geo_loc_lam_max_m = 200000.0
# radial displacement scales; 0 = (h/2 - 4) / 2
geo_disp_scales = 0
# finest displacement wavelength (m)
geo_disp_lam_min_m = 5.0
# coarsest displacement wavelength (m)
geo_disp_lam_max_m = 20000.0
# angular harmonics of the displacement channel (m=4: street-grid order)
geo_harmonics = [1, 4]
# cyclic C24 harmonics
time_hour_harmonics = 4
# cyclic C7 harmonics
time_dow_harmonics = 3
# SpeedGEO scales (dt and speed)
speed_scales = 6
# SpeedGEO shortest wavelength (log1p units)
speed_lo = 0.05
# SpeedGEO longest wavelength (log1p units)
speed_hi = 60.0

[search_space]
# used by `python -m geomob.cli search`: for any [encoders] or [model]
# key, the list of values to try. Every combination is a trial (grid),
# or a random subset of them (method = "random" in [search]).
# geo_loc_lam_min_m = [10.0, 25.0, 50.0]
# geo_loc_lam_max_m = [50000.0, 200000.0]
# geo_disp_lam_min_m = [2.0, 5.0, 10.0]
# geo_disp_lam_max_m = [5000.0, 20000.0]
# geo_harmonics = [[1], [1, 4], [1, 2, 4]]
# geo_loc_dims = [64, 80, 96, 112, 124]   # location share of h; 124 = no radial part

