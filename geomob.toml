[search]
# what a trial is scored on: trajectory similarity (any dataset) or a GeoLife downstream task
# objective = "similarity"
# similarity: KP@10 (default), MRR, MP, MR, global_MRR; tul: acc@1 (default), acc@5, macro_F1; eta: MAE (default), RMSE, MAPE; mode: macro_F1 (default), acc@1
# metric =
# grid = every combination; random = n_trials of them
# method = "grid"
# number of combinations when method = random
# n_trials = 20
# similarity objective: corpora to average over (missing ones are skipped)
# datasets = ["tdrive", "porto", "roma", "ais", "geolife"]
# default: geo for similarity, geo_ts (with time and speed) for the downstream objectives
# encoder =
# kind = "lstm"
# training epochs per trial (keep small: this is multiplied by the number of trials)
# epochs = 3
# bs = 128
# lr = 0.001
# similarity: training trajectories per dataset per trial
# n_train = 4000
# similarity: validation trajectories trials are scored on
# n_val = 1000
# similarity: size of the gpe_suite test set to hold out untouched (use the same value as [gpe_suite] n_test)
# n_test = 5000
# max_traj = 20000
# seeds = [0]
# which random subset is drawn when method = random
# search_seed = 0
# device = "cpu"
# out_dir = "results/search"
# ignore trials already recorded in out_dir/trials.jsonl
# no_resume = false
